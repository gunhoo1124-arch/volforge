name: Feature request
description: Propose a focused modeling, numerical, data, CLI, or UI improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the research or user problem, not only the desired implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the API, workflow, or behavior you would add.
    validations:
      required: true
  - type: textarea
    id: conventions
    attributes:
      label: Quantitative conventions and validation
      description: State formulas, units, boundaries, numerical checks, and benchmark evidence.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and risk
      description: Note schema, reproducibility, performance, or downstream-gate implications.
