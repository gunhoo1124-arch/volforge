[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volforge"
version = "1.11.0"
description = "Arbitrage-aware derivatives pricing, implied-volatility, and option-chain research laboratory."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/Apache-2.0.txt"]
authors = [{ name = "Frontier_Psychic" }]
keywords = [
  "derivatives",
  "heston",
  "implied-volatility",
  "options",
  "quantitative-finance",
  "ssvi",
  "svi",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "altair>=5.5,<7",
  "certifi>=2026.10.19",
  "cryptography>=50,<51",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pillow>=13,<14",
  "scipy>=1.14,<2",
  "streamlit>=1.66.1,<2",
]

[project.urls]
Homepage = "https://github.com/gunhoo1124-arch/volforge"
Repository = "https://github.com/gunhoo1124-arch/volforge.git"
Issues = "https://github.com/gunhoo1124-arch/volforge/issues"
Changelog = "https://github.com/gunhoo1124-arch/volforge/blob/main/CHANGELOG.md"

[project.scripts]
volforge = "volforge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/volforge"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp --cov=volforge --cov-report=term-missing"
cache_dir = ".pytest-tmp/cache"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
